name: Tests

# Runs the Python suite in tests/ on every push and pull request.
#
# Until now nothing ran these tests automatically. The suite existed and passed
# locally, but a regression could only be caught by someone remembering to run
# pytest by hand. Guards that nothing enforces are decoration.
#
# The matrix floor is measured, not guessed: the suite was verified passing on
# 3.11 and 3.14 locally, so the interpreters in between are covered by the same
# range. Hooks run under whatever python3 a user happens to have, so version
# spread is a real portability signal for this project, not ceremony.
#
# A windows-latest leg runs the same suite plus a real-spawn smoke test
# (test_spawn_detached_real_child) that spawns a child via spawn_detached
# on real Windows and asserts: (1) Popen is returned (not None), (2) the
# child exits 0, (3) GetConsoleWindow()==0 in the child (proving
# DETACHED_PROCESS took effect at the OS level), and (4)
# last_spawn_used_fallback is False (CREATE_BREAKAWAY_FROM_JOB succeeded
# without the retry path). This catches console-flash regressions and
# breakaway failures that macOS/Linux cannot see.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the repo.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # One red interpreter should not hide the result on the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The suite imports only the standard library plus the repo's own modules,
      # so pytest is the entire dependency footprint.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # Run from the repo root: the tests resolve the scripts under
      # skills/token-optimizer/scripts/ relative to it.
      - name: Run tests
        run: python -m pytest tests/ -q

  # plugins/token-optimizer/ is a generated mirror of root skills/ + hooks/
  # (scripts/sync-codex-marketplace-plugin.sh). Until now drift was only
  # caught at release-signing time, so a canonical-only edit could land on
  # main and ship a stale mirror to Codex users until the next release.
  # Regenerate and diff on every push/PR instead. ~5s, pure file copy + git.
  mirror-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify Codex marketplace mirror is in sync
        run: bash scripts/check-mirror-sync.sh

  # Windows leg: runs the same suite plus a real-spawn smoke test that
  # exercises spawn_utils.spawn_detached against an actual child process.
  # Catches console-flash regressions and CREATE_BREAKAWAY_FROM_JOB failures
  # that macOS/Linux cannot see.
  pytest-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  # Build the docs site here, not only in Deploy Docs.
  #
  # A single unescaped "<400" in an .mdx file broke the Astro build on 2026-07-22.
  # Deploy Docs went red on every run and the published site sat frozen at the
  # 2026-06-30 deploy for three weeks while documentation work kept landing on main.
  # It failed loudly in a workflow nobody was watching, which is the same as failing
  # quietly. Building here puts a broken page in front of the check that gates PRs,
  # so the break is caught before it reaches main instead of after it stops the world.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs site
        working-directory: docs-site
        run: npm run build

  # Can a stranger install this right now?
  #
  # Between v5.11.57 and v5.11.64 the answer was no, for eight consecutive
  # releases, and nothing in this repo noticed. install.sh verifies every install
  # against the CHECKSUMS.sha256 asset on the latest release and verification is
  # the default path; with no asset attached, resolve_latest_release() fails and
  # the install hard-aborts. Meanwhile everything visible from the inside was
  # green: tests passing, docs building, the maintainer's own machine on the
  # current version because /plugin installs from the marketplace clone and never
  # crosses that gate. The break existed only from where a new user stands, so
  # nothing that looks inward could ever have caught it.
  #
  # This job looks from the outside instead, at the live releases API, and turns
  # a dead installer into a red check in front of the PRs it should be blocking.
  # It is deliberately allowed to fail a push that did not cause it: if the
  # published install path is broken, that IS more urgent than the change in
  # flight, and burying it in a workflow nobody watches is how it survived
  # eleven releases.
  installable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # github.token only to lift the anonymous API rate limit -- shared runner
      # IPs burn the 60/hour allowance fast, and a rate-limited probe that
      # reports "not installable" would be a false alarm training people to
      # ignore this check.
      - name: Check the published release is installable
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-installable.sh
